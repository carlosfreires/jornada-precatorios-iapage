<div class="precator-container light-theme" [class.light-theme]="isLightTheme" role="main" aria-label="Assistente Jurídico PrecatorIA">
  <div class="particles" #particlesEl aria-hidden="true"></div>

    <div class="chat-widget">
      <div class="chat-toggle"
           (click)="toggleChat()"
           [attr.aria-expanded]="chatOpen"
           [attr.aria-label]="chatOpen ? 'Fechar chat' : 'Abrir chat'"
           role="button"
           tabindex="0"
           (keydown.enter)="toggleChat()"
           (keydown.space)="toggleChat(); $event.preventDefault()">
        <i class="fas fa-comments" aria-hidden="true"></i>
        <div class="notification-badge" *ngIf="showBadge" aria-live="polite">1</div>
      </div>
    </div>

    <!-- Chat Container Simplificado -->
    <div class="chat-overlay"
         [class.active]="chatOpen"
         (click)="closeChat()">
    </div>

    <div class="chat-modal"
         [class.active]="chatOpen"
         [class.minimized]="chatMinimized"
         role="dialog"
         aria-labelledby="chat-title"
         aria-modal="true"
         [attr.aria-hidden]="!chatOpen">

      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar" aria-hidden="true">
            <i class="fas fa-robot"></i>
            <div class="status-indicator online"></div>
          </div>
          <div class="chat-title">
            <h2 id="chat-title">PrecatorIA</h2>
            <p>Assistente de IA para Precatórios • Online</p>
          </div>
        </div>
        <div class="chat-actions">
          <button class="chat-action-btn"
                  (click)="minimizeChat()"
                  aria-label="Minimizar Chat"
                  [attr.aria-expanded]="!chatMinimized">
              <img src="/png/minimize.png" alt="minimizar chate" class="fas" [class.fa-window-minimize]="!chatMinimized" [class.fa-expand]="chatMinimized" >
            <!-- <i class="fas" [class.fa-window-minimize]="!chatMinimized" [class.fa-expand]="chatMinimized" aria-hidden="true"></i> -->
          </button>
          <button class="chat-action-btn"
                  (click)="closeChat()"
                  aria-label="Fechar Chat">
            <img src="/png/close.png" alt="fechar chate" class="fas fa-times">
          <!--  <i class="fas fa-times" aria-hidden="true"></i> -->
          </button>
        </div>
      </div>

      <div class="chat-body" *ngIf="!chatMinimized">
        <div class="chat-messages"
             #messagesBox
             role="log"
             aria-live="polite"
             aria-label="Mensagens da conversa">

          <div *ngFor="let m of messages; let i = index"
               [ngClass]="{'message': true, 'user-message': m.from === 'user', 'bot-message': m.from === 'bot'}"
               [attr.role]="m.from === 'user' ? 'status' : 'article'"
               [attr.aria-label]="m.from === 'user' ? 'Sua mensagem' : 'Resposta do assistente'">
            <div class="message-avatar" aria-hidden="true">
              <i [class]="m.from === 'user' ? 'fas fa-user' : 'fas fa-robot'"></i>
            </div>
            <div class="message-content">
              <div class="message-text" [innerHTML]="m.text"></div>
              <div class="message-time" aria-hidden="true">{{m.time}}</div>
            </div>
          </div>

          <div *ngIf="isTyping" class="message-typing" aria-live="polite">
            <div class="typing-indicator">
              <div class="typing-dots" aria-hidden="true">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
              </div>
              <span>PrecatorIA está pensando...</span>
            </div>
          </div>
        </div>

   <!--     <div class="quick-suggestions" *ngIf="messages.length <= 2">
          <h3 class="suggestions-title">Perguntas frequentes:</h3>
          <div class="suggestions-grid">
            <button class="suggestion-btn"
                    *ngFor="let suggestion of suggestions.slice(0, 4)"
                    (click)="useSuggestion(suggestion)"
                    [attr.aria-label]="'Usar sugestão: ' + suggestion">
              {{suggestion}}
            </button>
          </div>
        </div>  -->

        <div class="chat-input-container">
          <div class="chat-input-wrapper">
            <textarea class="chat-input"
                      [(ngModel)]="userText"
                      (input)="autoResize($event)"
                      (keydown.enter)="$event.preventDefault(); send()"
                      #userInput
                      rows="1"
                      placeholder="Digite sua mensagem sobre precatórios..."
                      aria-label="Digite sua mensagem"
                      aria-required="true"></textarea>
            <button class="send-button"
                    (click)="send()"
                    [disabled]="!userText.trim()"
                    aria-label="Enviar Mensagem"
                    [attr.aria-disabled]="!userText.trim()">
                    <img src="/png/send.png" alt="Enviar mensagem" class="fas fa-paper-plane" aria-hidden="true">
            <!--  <i class="fas fa-paper-plane" aria-hidden="true"></i> -->
            </button>
          </div>
          <div class="input-suggestions" *ngIf="userText.length === 0">
            <button class="suggestion-chip"
                    *ngFor="let suggestion of suggestions.slice(0, 3)"
                    (click)="useSuggestion(suggestion)"
                    [attr.aria-label]="'Usar sugestão: ' + suggestion">
              {{suggestion}}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
